# ============================================================================================
# Phase 5: DEVELOPMENT PROFILE ('dev') - MySQL Database: agriculture_FM_System_DB
# ============================================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/agriculture_FM_System_DB?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# ============================================================================================
# Phase 4: HikariCP Connection Pool (Development Tuning)
# ============================================================================================
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=AgricultureDevHikariPool

# ============================================================================================
# Phase 3: JPA & Hibernate Configuration (Development Mode)
# ============================================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================================================
# Logging Configuration (Verbose for Debugging)
# ============================================================================================
logging.level.root=INFO
logging.level.com.AgricultureFMSystem.AgricultureFMSystem=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

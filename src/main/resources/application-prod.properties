# ============================================================================================
# Phase 5: PRODUCTION PROFILE ('prod') - High Performance & Secure MySQL
# ============================================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agriculture_FM_System_DB}?useSSL=true&requireSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ============================================================================================
# Production-Grade HikariCP Connection Pool
# ============================================================================================
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=AgricultureProdHikariPool

# ============================================================================================
# Safe Hibernate Production Configuration (Validate only, never auto-alter schema)
# ============================================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Production logging: ERROR and WARN only for infrastructure, INFO for business logic
logging.level.root=WARN
logging.level.com.AgricultureFMSystem.AgricultureFMSystem=INFO
logging.level.org.hibernate=ERROR

# ============================================================================================
# Phase 5: TEST PROFILE ('test') - In-Memory Isolated Database
# ============================================================================================
spring.datasource.url=jdbc:h2:mem:agriculture_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Optional during test inspection)
spring.h2.console.enabled=false

# Re-create schema clean on every test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Compact logging for tests
logging.level.root=WARN
logging.level.com.AgricultureFMSystem.AgricultureFMSystem=INFO
logging.level.org.hibernate=WARN

# ============================================================================================
# Phase 5: Spring Boot Base Configuration & Active Profile
# ============================================================================================
spring.application.name=AgricultureFMSystem
server.port=8080

# Active Profile: 'dev' (MySQL), 'prod' (Production MySQL with Env Vars), or 'test' (H2 in-memory)
spring.profiles.active=dev

# ============================================================================================
# Phase 4: OpenAPI / Swagger UI Common Configuration
# ============================================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true

# ============================================================================================
# Phase 4: Spring Boot Actuator Endpoints & Monitoring
# ============================================================================================
# Expose actuator management endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics,beans,env,mappings,scheduledtasks,loggers,agriculture
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true

# Actuator Info configuration
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Custom Application Info metadata exposed at /actuator/info
info.app.name=Agriculture Farm Management System (AFMS)
info.app.description=Enterprise Precision Farm Management Platform for Crops, Fields, Activities, Expenses, and Harvests
info.app.version=1.0.0
info.app.team=AgroTech Engineering
info.app.phase=Phase 4: Actuator, Health Indicators & Custom Endpoints
info.app.currency=INR (₹)
info.app.database=MySQL 8.0 (agriculture_FM_System_DB)

# ============================================================================================
# Spring JPA Global Defaults
# ============================================================================================
spring.jpa.open-in-view=false

# ============================================================================================
# File Upload Storage & Multipart Limits
# ============================================================================================
app.file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================================================
# Security & JWT Settings (require Bearer JWT on protected /api/** routes)
# ============================================================================================
app.security.require-auth=true
app.security.jwt-expiration-ms=86400000
